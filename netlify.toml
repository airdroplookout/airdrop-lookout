# Airdrop Lookout — Netlify config.
# Hosting: Netlify (free). Static front-end in public/, server code in
# netlify/functions/. No build step. Env vars are set in the Netlify
# dashboard (Site settings -> Environment variables), never in this file.
[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Hidden owner route: /manage serves the single-page app, which opens the
# Manage view. No public link points here.
[[redirects]]
  from = "/manage"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/manage/*"
  to = "/index.html"
  status = 200

# /api/* rewrites: the front-end and the weekly job keep calling the same
# /api/* URLs as before; Netlify rewrites each one (200, invisible to the
# browser) to its function. Query strings pass through, so PATCH
# /api/admin/airdrops?id=...&status=... still works. For the three
# /api/admin/issues/:id/... routes the id is also passed as ?id= so the
# function does not depend on how Netlify reports the rewritten path.
[[redirects]]
  from = "/api/admin/login"
  to = "/.netlify/functions/admin-login"
  status = 200
[[redirects]]
  from = "/api/admin/logout-all"
  to = "/.netlify/functions/admin-logout-all"
  status = 200
[[redirects]]
  from = "/api/board"
  to = "/.netlify/functions/board"
  status = 200
[[redirects]]
  from = "/api/track"
  to = "/.netlify/functions/track"
  status = 200
[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200
[[redirects]]
  from = "/api/unsubscribe"
  to = "/.netlify/functions/unsubscribe"
  status = 200
[[redirects]]
  from = "/api/settings"
  to = "/.netlify/functions/settings"
  status = 200
[[redirects]]
  from = "/api/admin/subscribers"
  to = "/.netlify/functions/admin-subscribers"
  status = 200
[[redirects]]
  from = "/api/admin/airdrops"
  to = "/.netlify/functions/admin-airdrops"
  status = 200
[[redirects]]
  from = "/api/admin/export"
  to = "/.netlify/functions/admin-export"
  status = 200
[[redirects]]
  from = "/api/admin/issues"
  to = "/.netlify/functions/admin-issues"
  status = 200
[[redirects]]
  from = "/api/admin/overview"
  to = "/.netlify/functions/admin-overview"
  status = 200
[[redirects]]
  from = "/api/admin/payments"
  to = "/.netlify/functions/admin-payments"
  status = 200
[[redirects]]
  from = "/api/admin/payments/verify"
  to = "/.netlify/functions/admin-payments-verify"
  status = 200
[[redirects]]
  from = "/api/admin/settings"
  to = "/.netlify/functions/admin-settings"
  status = 200
[[redirects]]
  from = "/api/admin/issues/:id/publish"
  to = "/.netlify/functions/admin-issues-id-publish?id=:id"
  status = 200
[[redirects]]
  from = "/api/admin/issues/:id/preview"
  to = "/.netlify/functions/admin-issues-id-preview?id=:id"
  status = 200
[[redirects]]
  from = "/api/admin/issues/:id/send"
  to = "/.netlify/functions/admin-issues-id-send?id=:id"
  status = 200

# Security headers on every page. The CSP baseline is deliberately
# conservative: scripts only from this site (no inline handlers — the
# front-end uses addEventListener), styles from this site plus inline
# style attributes, images from this site, no plugins, no framing.
# API responses also carry nosniff / frame / referrer headers from _lib.js.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.promptfrenzy.com https://goodsaas.xyz https://saaslineup.com https://thesaasdir.com https://indielineup.com https://thedevtoolsindex.com; font-src 'self'; connect-src 'self' https://api.coingecko.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
